<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quiz2</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		*{
			margin: 0px;
			padding-top: 0px;
			box-sizing: border-box;
			font-family: Gothic Sans;
		}
		.card-container{
			display: flex;
			padding-top: 100px;
			justify-content: center;
			flex-wrap: wrap;
			margin-top: 100px;
		}
		.card{
			width: 325px;
			border-radius: 8px;
			overflow: hidden;
			box-shadow: 0px 2px 4px rgba(0,0,0,0.2);
			margin: 20px;
			transition: transform 0.6s ease;
		}
		.card:hover{
			transform: translateY(-20px);
		}
		.card img{
			width: 100%;
			height: auto;
		}
	</style>
</head>
<body>
	<center>
	<h1>Scorer</h1>
	
	<form>
		<div class="container">
		<details ontoggle="message()">
			<summary>Instructions</summary>
				<i id="show">Input your grade for the following subjects and let us calculate your average.</i>
		</details>
	</div>
	</form>

	<div class="card-container">
		<div class="card">
			<img src="https://m.media-amazon.com/images/I/A1zCEYn2FLL._AC_UF1000,1000_QL80_.jpg"></button>
			<input type="text" class="form-control" style="width: 500px;">
		</div>
	</div>

	<div class="card-container">
	<div class="card">
		<img src="https://i.pinimg.com/736x/47/22/a7/4722a73e49a82924757e9355f69b8866.jpg"></button>
		<input type="text" class="form-control" style="width: 500px;">
	</div>
</div>

	<div class="card-container">
	<div class="card">
		<img src="https://marketplace.canva.com/EAE-FzvFer4/2/0/1236w/canva-social-studies-notebook-cover-vMzAuA3IuP8.jpg"></button>
		<input type="text" class="form-control" style="width: 500px;">
	</div>
</div>


	<script>
		let average = Filipino + Mathematics + SS /3

		switch(true){
			case average >= 94 to 100 || average >= 87 to 93.99:
				alert("Excellent")
				break;
			default:
				alert("Above Satisfactory")

			case average >= 80 to 86.99 || average >= 75 to 79.99:
				alert("Satisfactory")
				break;
			default:
				alert("Needs Improvement")

			case average === 70 to 74.99
				alert("Poor")
				break;
		}
	</script>












	</center>
</body>
</html>
